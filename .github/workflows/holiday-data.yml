name: Holiday data

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"
    - cron: "0 3 * 9-12 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          cache: true
      - uses: astral-sh/setup-uv@v6
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter dependencies
        run: fvm flutter pub get
      - name: Install data tooling
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            "basedpyright>=1.37,<2" \
            "holidays>=0.102,<1" \
            "pydantic>=2.12,<3" \
            "pytest>=9,<10" \
            "ruff>=0.14,<1" \
            "typer>=0.21,<1"
      - name: Validate generated data
        run: uv run --no-project tool/sync_holidays.py --check
      - name: Validate Python tooling
        run: |
          .venv/bin/ruff check tool
          .venv/bin/ruff format --check tool
          .venv/bin/basedpyright --pythonpath .venv/bin/python tool
          .venv/bin/python -m pytest -q tool/tests
      - name: Validate Dart package
        run: |
          fvm dart format --output=none --set-exit-if-changed \
            lib/world_holidays.dart \
            lib/src/models \
            lib/src/world_holidays.dart \
            test \
            example
          fvm flutter analyze --no-pub
          fvm flutter test --no-pub
          fvm flutter pub publish --dry-run

  synchronize:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generate rolling holiday horizon
        run: |
          uv run --no-project tool/sync_holidays.py \
            --current-year "$(date -u +%Y)"
      - name: Open reviewed data update
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/holiday-data
          delete-branch: true
          commit-message: "chore: 공휴일 데이터 자동 동기화"
          title: "chore: 공휴일 데이터 자동 동기화"
          body: |
            `python-holidays` 계산 결과와 프로젝트 보정 데이터를 병합했습니다.
            병합 전에 국가별 임시·대체 공휴일과 설명을 검토해 주세요.
